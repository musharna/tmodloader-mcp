name: tests

# NO PATH FILTERS, deliberately.
#
# A workflow that only runs when certain paths change cannot fire on the pull
# request that introduces it, and a green PR then reads as a passing check that
# never ran. Everything here is cheap - the suite is a few seconds - so there is
# nothing to buy by narrowing the trigger, and a real check to lose.
on:
  push:
    branches: [master]
  pull_request:

# A push to a branch with an open PR would otherwise run this twice. The
# `push` trigger above is limited to master for the same reason: one run per
# change, on an account where Actions minutes are a real budget.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # The suite takes three seconds. Without this a hung step - a stalled
    # download, a future test that waits on something that never comes - runs to
    # GitHub's six-hour default, and this account's Actions budget is small
    # enough that one such run is a measurable fraction of the month.
    timeout-minutes: 10

    strategy:
      # Both versions report. Cancelling 3.13 because 3.12 failed hides whether
      # the failure is version-specific, which is the only question a matrix is
      # here to answer.
      fail-fast: false
      matrix:
        # pyproject says `requires-python = ">=3.12"` and advertises both in its
        # classifiers, so both are installable and only one was ever run. A
        # supported version nothing exercises is a claim, not a fact - the same
        # shape as the README's PNG check that had never existed.
        python: ["3.12", "3.13"]

    steps:
      # v7 is a floating major tag that was verified to exist. setup-uv below
      # is pinned exactly because it publishes NO floating major - it has
      # v9.0.0 and v7.6, but no v9, so `@v9` would fail to resolve at all.
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # Lint before tests: this suite stayed green while `live_check.py` held
      # an undefined name, because that script is not collected by pytest.
      # Ruff is what caught it, so ruff is a gate rather than a suggestion.
      - name: ruff
        run: uv run --python ${{ matrix.python }} ruff check .

      # Formatting was enforced by an editor hook and by habit, and by nothing
      # that would stop a branch. It held only because every commit so far
      # happened to pass through that hook; a contributor without it, or a
      # dependabot branch, would have been merged unformatted with CI green.
      - name: ruff format
        run: uv run --python ${{ matrix.python }} ruff format --check .

      - name: pytest
        run: uv run --python ${{ matrix.python }} pytest -q

  # The C# half. It compiles responder/ with nothing of any mod's on the compile
  # line, which is the whole vendorability claim - so it runs here rather than
  # depending on somebody having a game installed. It does NOT build a mod:
  # `tModLoader.dll -build` needs the engine and a real install, and FrameShot
  # is excluded from this project for the same reason.
  responder:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # global.json pins 8.0.x. Without it `dotnet` takes the highest SDK on the
      # runner, which is not the one anybody develops against.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: dotnet test
        run: dotnet test responder/tests/Responder.Tests.csproj --verbosity normal

  # The suite drives a Windows game through /mnt/c, so nothing here can test
  # THAT seam - a Linux runner has no tModLoader to launch. What runs is
  # everything that does not need one, which is all of it: no test touches a
  # real install (`world_problem` is string logic, and the config paths are
  # stubbed). `tests/live_check.py` is the part that needs a real game, and it
  # is a script rather than a collected test for exactly that reason.
